<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazin Kassa, Nasiya & Firmalar</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 800; /* Barcha yozuvlar qalin BOLD */
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Yuqori Panel */
        header {
            background-color: #111827;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1f2937;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: #1f2937;
            color: #9ca3af;
            border: 2px solid #374151;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }
        .dot.active { 
            background: #10b981; 
            box-shadow: 0 0 8px #10b981;
        }

        .btn-shift {
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .btn-open-shift { background: #10b981; color: #ffffff; }
        .btn-close-shift { background: #ef4444; color: #ffffff; }

        /* Asosiy Ekran Bo'limlari */
        .content-section {
            display: none;
            flex: 1;
            width: 100%;
        }

        .content-section.active {
            display: flex;
        }

        /* 1. KASSA */
        .kassa-container {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 16px;
            padding: 16px;
            width: 100%;
        }

        .pos-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .display-screen {
            background: #030712;
            border: 2px solid #1f2937;
            border-radius: 14px;
            padding: 14px 20px;
            text-align: right;
        }

        .display-label {
            font-size: 13px;
            color: #9ca3af;
        }

        .display-amount {
            font-size: 46px;
            color: #38bdf8;
            min-height: 54px;
            line-height: 1.2;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            flex: 1;
        }

        .key-btn {
            background: #1f2937;
            color: #ffffff;
            border: 2px solid #374151;
            border-radius: 12px;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-height: 60px;
        }

        .key-btn:active {
            transform: scale(0.96);
            background: #374151;
        }

        .key-btn.action {
            background: #374151;
            color: #f87171;
        }

        .pay-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .pay-btn {
            border: none;
            border-radius: 12px;
            padding: 18px 8px;
            font-size: 17px;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            text-align: center;
        }

        .pay-btn:active { transform: scale(0.95); }

        .btn-cash { background: #16a34a; }
        .btn-card { background: #2563eb; }
        .btn-debt { background: #ea580c; }
        .btn-expense { background: #dc2626; }

        /* Kassa Statistikalari */
        .admin-section {
            background: #111827;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 2px solid #1f2937;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: #030712;
            border-radius: 10px;
            padding: 12px 14px;
            border: 2px solid #1f2937;
        }

        .stat-card.full { grid-column: span 2; }

        .stat-title {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .stat-val { font-size: 22px; }
        .val-cash { color: #4ade80; }
        .val-card { color: #60a5fa; }
        .val-debt { color: #fb923c; }
        .val-expense { color: #f87171; }

        .feed-container {
            flex: 1;
            background: #030712;
            border-radius: 10px;
            border: 2px solid #1f2937;
            padding: 12px;
            overflow-y: auto;
            max-height: 280px;
        }

        .feed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 2px solid #111827;
            font-size: 15px;
        }

        .feed-type {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .badge-cash { background: #16a34a33; color: #4ade80; border: 1px solid #16a34a; }
        .badge-card { background: #2563eb33; color: #60a5fa; border: 1px solid #2563eb; }
        .badge-debt { background: #ea580c33; color: #fb923c; border: 1px solid #ea580c; }
        .badge-expense { background: #dc262633; color: #f87171; border: 1px solid #dc2626; }

        /* 2. NASIYA VA 3. FIRMALAR BO'LIMI */
        .ledger-container {
            padding: 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ledger-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 16px;
            border-radius: 14px;
            border: 2px solid #1f2937;
            flex-wrap: wrap;
            gap: 12px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }

        .item-card {
            background: #111827;
            border: 2px solid #1f2937;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title { font-size: 18px; color: #f3f4f6; }

        .item-balance {
            font-size: 26px;
            color: #fb923c;
            background: #030712;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #1f2937;
        }

        /* Modallar */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
            overflow-y: auto;
        }

        .modal.active { display: flex; }

        .modal-card {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 16px;
            padding: 22px;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-card label {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: -4px;
        }

        .modal-card input, .modal-card select {
            background: #030712;
            border: 2px solid #374151;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }

        .btn-confirm { background: #10b981; color: #ffffff; }
        .btn-cancel { background: #374151; color: #ffffff; }

        .debtor-chips-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
            background: #030712;
            padding: 6px;
            border-radius: 10px;
            border: 1px solid #374151;
        }

        .debtor-chip {
            background: #1f2937;
            border: 2px solid #374151;
            color: #f3f4f6;
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .debtor-chip.selected {
            background: #ea580c;
            border-color: #fb923c;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(234, 88, 12, 0.4);
        }

        .family-chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .family-chip {
            background: #1f2937;
            border: 1px solid #374151;
            color: #9ca3af;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .family-chip.active {
            background: #38bdf8;
            border-color: #0284c7;
            color: #030712;
        }

        @media (max-width: 900px) {
            .kassa-container { grid-template-columns: 1fr; }
        }
    </style>

    <!-- ASOSIY FUNKSIYALAR HECH QACHON XATO BERMASLIGI UCHUN BIRINCHI YUKLANADI -->
    <script>
        // Tablarni almashtirish (Kassa, Nasiya, Firmalar)
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

            const activeBtn = document.getElementById('tabBtn_' + tabName);
            const activeSec = document.getElementById('section_' + tabName);

            if (activeBtn) activeBtn.classList.add('active');
            if (activeSec) activeSec.classList.add('active');
        }

        function closeModals() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        }
    </script>
</head>
<body>

    <!-- Yuqori Panel -->
    <header>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabBtn_kassa" onclick="switchTab('kassa')">💰 KASSA</button>
            <button class="tab-btn" id="tabBtn_nasiya" onclick="switchTab('nasiya')">📒 NASIYA</button>
            <button class="tab-btn" id="tabBtn_firmalar" onclick="switchTab('firmalar')">🏢 FIRMALAR</button>
        </div>

        <div class="status-badge">
            <span class="dot" id="statusDot"></span>
            <span id="shiftStatusText">KUN YOPIQ</span>
            <span style="color: #4b5563;">|</span>
            <span id="activeStaffText">HODIM: TANLANMAGAN</span>
        </div>

        <div>
            <button class="btn-shift btn-open-shift" id="shiftActionBtn" onclick="toggleShiftModal()">KUNNI OCHISH</button>
        </div>
    </header>

    <!-- 1. KASSA BO'LIMI -->
    <div class="content-section active" id="section_kassa">
        <div class="kassa-container">
            <div class="pos-section">
                <div class="display-screen">
                    <div class="display-label">SUMMA:</div>
                    <div class="display-amount" id="displayAmount">0</div>
                </div>

                <div class="keypad-grid">
                    <button class="key-btn" onclick="pressKey('1')">1</button>
                    <button class="key-btn" onclick="pressKey('2')">2</button>
                    <button class="key-btn" onclick="
